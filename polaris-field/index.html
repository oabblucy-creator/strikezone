<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>北極星 · POLARIS</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#04060c;overflow:hidden;font-family:'Noto Sans TC',system-ui,sans-serif;color:#e6f0ff;user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(2,4,10,.62) 100%)}
  #flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 68% 62%,rgba(140,225,255,.75),rgba(76,194,255,0) 58%);opacity:0}
  #cross{position:fixed;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#d8f6ff;box-shadow:0 0 8px #4cc2ff,0 0 2px #fff;pointer-events:none;opacity:.9}
  #cross i{position:absolute;background:rgba(190,240,255,.75);box-shadow:0 0 6px #4cc2ff}
  #cross i:nth-child(1){left:-16px;top:1.5px;width:9px;height:2px}
  #cross i:nth-child(2){left:12px;top:1.5px;width:9px;height:2px}
  #cross i:nth-child(3){left:1.5px;top:-16px;width:2px;height:9px}
  #cross i:nth-child(4){left:1.5px;top:12px;width:2px;height:9px}
  .ui{position:fixed;pointer-events:none;transition:opacity .3s}
  #name{right:30px;bottom:28px;text-align:right}
  #name .big{font-weight:900;font-size:42px;line-height:1;letter-spacing:8px;color:#eef8ff;text-shadow:0 0 14px #4cc2ff,0 0 44px rgba(76,194,255,.55)}
  #name .sub{font-family:Orbitron,monospace;font-size:12px;letter-spacing:5px;color:#8fd6ff;opacity:.9;margin-top:8px}
  #name .bar{height:2px;margin-top:10px;background:linear-gradient(90deg,transparent,#4cc2ff 55%,#fff);box-shadow:0 0 10px #4cc2ff}
  #hits{left:30px;bottom:28px;font-family:Orbitron,monospace;font-size:12px;letter-spacing:4px;color:#8fd6ff}
  #hits b{display:block;font-size:36px;line-height:1;margin-bottom:6px;color:#fff;text-shadow:0 0 12px #4cc2ff;font-weight:800}
  #combo{left:50%;top:58%;transform:translateX(-50%);font-family:Orbitron,monospace;font-size:22px;letter-spacing:6px;color:#fff;text-shadow:0 0 14px #4cc2ff,0 0 30px #4cc2ff;opacity:0}
  #hint{left:50%;bottom:16px;transform:translateX(-50%);font-size:12px;letter-spacing:2px;color:rgba(200,225,255,.5);white-space:nowrap}
  #hint b{color:#bfefff;font-weight:700;margin:0 3px 0 12px}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .45s;
    background:radial-gradient(ellipse at center,rgba(4,8,18,.45),rgba(2,4,10,.93))}
  #overlay.hide{opacity:0;pointer-events:none}
  #overlay h1{font-size:104px;font-weight:900;letter-spacing:22px;margin:0 0 0 22px;color:#f4fbff;text-shadow:0 0 22px #4cc2ff,0 0 80px rgba(76,194,255,.6)}
  #overlay h2{font-family:Orbitron,monospace;font-weight:500;font-size:15px;letter-spacing:13px;color:#8fd6ff;margin:14px 0 46px 13px}
  #overlay .go{font-size:17px;letter-spacing:7px;color:#eaf6ff;padding:13px 36px 13px 43px;border:1px solid rgba(143,214,255,.65);animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 18px rgba(76,194,255,.35),inset 0 0 18px rgba(76,194,255,.12)}50%{box-shadow:0 0 36px rgba(76,194,255,.8),inset 0 0 28px rgba(76,194,255,.28)}}
  #overlay .keys{margin-top:38px;font-size:13px;letter-spacing:2px;color:rgba(200,225,255,.62);line-height:2.1;text-align:center}
  #overlay .keys b{display:inline-block;min-width:64px;color:#bfefff;font-weight:700;margin-right:8px;text-align:right}
  #overlay .tiny{margin-top:26px;font-size:11px;letter-spacing:1px;color:rgba(200,225,255,.35)}
  #cross.hit{animation:hm .22s ease-out} #cross.hit i{background:#fff;box-shadow:0 0 10px #fff}
  #cross.crit{animation:hmc .3s ease-out} #cross.crit i{background:#ffd166;box-shadow:0 0 12px #ff8c42}
  @keyframes hm{0%{transform:scale(1.9)}100%{transform:scale(1)}}
  @keyframes hmc{0%{transform:scale(2.6)}100%{transform:scale(1)}}
  .dmg{position:fixed;font-family:Orbitron,monospace;font-weight:800;font-size:26px;color:#fff;text-shadow:0 0 10px #4cc2ff,0 0 2px #000;pointer-events:none;transform:translate(-50%,0);animation:dmgUp .85s ease-out forwards}
  .dmg.crit{font-size:40px;color:#ffd166;text-shadow:0 0 14px #ff8c42,0 0 2px #000}
  @keyframes dmgUp{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
  body.creed #name .big{text-shadow:0 0 14px #ff5a3a,0 0 44px rgba(255,90,58,.55)}
  body.creed #name .sub{color:#ffb29a} body.creed #name .bar{background:linear-gradient(90deg,transparent,#ff5a3a 55%,#fff);box-shadow:0 0 10px #ff5a3a}
  body.creed #cross{background:#ffd9cc;box-shadow:0 0 8px #ff5a3a,0 0 2px #fff} body.creed #cross i{background:rgba(255,200,180,.75);box-shadow:0 0 6px #ff5a3a}
  body.creed #hits{color:#ffb29a} body.creed #hits b{text-shadow:0 0 12px #ff5a3a}
  body.creed .dmg{text-shadow:0 0 10px #ff5a3a,0 0 2px #000}
  body.creed #flash{background:radial-gradient(ellipse at 68% 62%,rgba(255,150,120,.75),rgba(255,90,58,0) 58%)}
  #big{left:50%;top:40%;transform:translateX(-50%);font-family:Orbitron,monospace;font-weight:800;font-size:44px;letter-spacing:8px;color:#ffd166;text-shadow:0 0 18px #ff8c42,0 0 40px #ff8c42;opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="flash"></div>
<div id="cross"><i></i><i></i><i></i><i></i></div>
<div id="hits" class="ui"><b id="hitN">0</b>HITS · 命中</div>
<div id="combo" class="ui">COMBO ×3</div>
<div id="big" class="ui"></div>
<div id="dmgs"></div>
<div id="name" class="ui"><div class="big">北極星</div><div class="sub">POLARIS · OTF TACTICAL</div><div class="bar"></div></div>
<div id="hint" class="ui"><b>WASD</b>移動<b>Shift</b>衝刺<b>左鍵</b>揮刀<b>F</b>耍刀<b>R</b>收刀 / 出刀<b>1 / 2</b>換刀<b>Esc</b>離開</div>
<div id="overlay">
  <h1>北極星</h1>
  <h2>POLARIS · OTF SWITCHBLADE</h2>
  <div class="go">點擊畫面 · 出刀</div>
  <div class="keys"><b>WASD</b>移動 &nbsp;<b>Shift</b>衝刺 &nbsp;<b>空白鍵</b>跳<br><b>左鍵</b>揮刀（連按三下 = 砍 · 砍 · 刺） &nbsp;<b>F</b>耍刀 &nbsp;<b>R</b>收刀 / 出刀<br><b>1 / 2</b>北極星 / 信條（Q 也能切換）</div>
  <div class="tiny">砍那幾個稻草靶試試手感</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
'use strict';
const TH=window.THREE;
const $=id=>document.getElementById(id);

/* ================= 渲染器 / 相機 / 後製泛光 ================= */
const canvas=$('c');
const renderer=new TH.WebGLRenderer({canvas:canvas,antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=TH.PCFSoftShadowMap;
renderer.toneMapping=TH.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
renderer.outputEncoding=TH.sRGBEncoding;
const scene=new TH.Scene();
scene.fog=new TH.FogExp2(0x010307,0.0072);
const camera=new TH.PerspectiveCamera(76,16/9,0.04,1500);
camera.rotation.order='YXZ'; scene.add(camera);

const composer=new TH.EffectComposer(renderer);
composer.addPass(new TH.RenderPass(scene,camera));
const bloom=new TH.UnrealBloomPass(new TH.Vector2(1280,720),0.62,0.28,0.88);   // 強度 / 半徑 / 門檻
composer.addPass(bloom);
composer.addPass(new TH.ShaderPass(TH.GammaCorrectionShader));
function resize(w,h){
  w=w||window.innerWidth; h=h||window.innerHeight; if(!w||!h) return;
  renderer.setSize(w,h,false); composer.setSize(w,h);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize',()=>resize()); resize();

/* ================= 貼圖小工具（全部程序生成，沒有外部素材） ================= */
function makeTex(draw,S){
  S=S||512; const c=document.createElement('canvas'); c.width=c.height=S;
  const g=c.getContext('2d'); draw(g,S);
  const t=new TH.CanvasTexture(c); t.wrapS=t.wrapT=TH.RepeatWrapping; t.anisotropy=8; return t;
}
function grain(g,S,amt){
  const im=g.getImageData(0,0,S,S),d=im.data;
  for(let i=0;i<d.length;i+=4){ const n=(Math.random()-0.5)*amt; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
  g.putImageData(im,0,0);
}
function wear(g,S,strength){                             // 使用痕跡：稜角掉漆露金屬 + 刮痕
  strength=strength==null?1:strength;
  const edge=S*0.09, mk=(x0,y0,x1,y1)=>{ const gr=g.createLinearGradient(x0,y0,x1,y1); gr.addColorStop(0,'rgba(92,94,100,'+(0.5*strength)+')'); gr.addColorStop(1,'rgba(92,94,100,0)'); return gr; };
  g.fillStyle=mk(0,0,0,edge); g.fillRect(0,0,S,edge); g.fillStyle=mk(0,S,0,S-edge); g.fillRect(0,S-edge,S,edge);
  g.fillStyle=mk(0,0,edge,0); g.fillRect(0,0,edge,S); g.fillStyle=mk(S,0,S-edge,0); g.fillRect(S-edge,0,edge,S);
  for(let i=0;i<10*strength;i++){ g.fillStyle='rgba('+(78+Math.random()*34|0)+','+(80+Math.random()*34|0)+',92,'+(0.22+Math.random()*0.32)+')';
    g.beginPath(); g.ellipse(Math.random()*S,Math.random()*S,3+Math.random()*10,2+Math.random()*7,Math.random()*6,0,7); g.fill(); }
  for(let i=0;i<16*strength;i++){ g.strokeStyle=Math.random()<.5?'rgba(205,210,220,0.11)':'rgba(0,0,0,0.13)'; g.lineWidth=Math.random()<.82?1:2; g.beginPath();
    const x=Math.random()*S,y=Math.random()*S,a=Math.random()*6.28,l=10+Math.random()*46; g.moveTo(x,y); g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); g.stroke(); }
}
function brushed(hex){                                   // 拉絲金屬
  const r=(hex>>16)&255,gg=(hex>>8)&255,b=hex&255;
  return makeTex((g,S)=>{
    g.fillStyle='rgb('+r+','+gg+','+b+')'; g.fillRect(0,0,S,S);
    for(let i=0;i<300;i++){ const l=(Math.random()-0.5)*44;
      g.strokeStyle='rgba('+(l>0?255:0)+','+(l>0?255:0)+','+(l>0?255:0)+','+(Math.abs(l)/44*0.09)+')';
      g.lineWidth=1; g.beginPath(); const y=Math.random()*S; g.moveTo(0,y); g.lineTo(S,y); g.stroke(); }
    grain(g,S,6);
  });
}
function softDot(){                                      // 柔光點（粒子 / 光暈）
  return makeTex((g,S)=>{ const r=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
    r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.3,'rgba(255,255,255,.55)'); r.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=r; g.fillRect(0,0,S,S); },128);
}
function flareTex(){                                     // 四芒星光（北極星本尊）
  return makeTex((g,S)=>{ const c=S/2;
    const r=g.createRadialGradient(c,c,0,c,c,c*0.5);
    r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.22,'rgba(200,238,255,.75)'); r.addColorStop(1,'rgba(120,200,255,0)');
    g.fillStyle=r; g.fillRect(0,0,S,S);
    for(const a of [0,Math.PI/2]){ const gr=g.createLinearGradient(0,0,S,0);
      gr.addColorStop(0,'rgba(200,240,255,0)'); gr.addColorStop(.5,'rgba(255,255,255,.95)'); gr.addColorStop(1,'rgba(200,240,255,0)');
      g.save(); g.translate(c,c); g.rotate(a); g.fillStyle=gr; g.fillRect(-c,-S*0.011,S,S*0.022); g.restore(); }
  },256);
}
const DOT=softDot(), FLARE=flareTex();

/* ================= 夜空：星空球 + 銀河 + 北極星 + 小北斗 ================= */
function skyTex(){
  const W=2048,H=1024,c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#02040c'); gr.addColorStop(.36,'#070d22'); gr.addColorStop(.48,'#0d1a3c');
  gr.addColorStop(.535,'#1a2f5c'); gr.addColorStop(.6,'#0a1226'); gr.addColorStop(1,'#03050a');
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  g.save(); g.translate(W*0.62,H*0.34); g.rotate(-0.42);                 // 銀河帶
  for(let i=0;i<320;i++){ const x=(Math.random()-0.5)*W*1.5, y=(Math.random()-0.5)*H*0.15*(0.4+Math.random());
    const r=40+Math.random()*130, a=0.02+Math.random()*0.05;
    const rg=g.createRadialGradient(x,y,0,x,y,r); rg.addColorStop(0,'rgba(160,185,245,'+a+')'); rg.addColorStop(1,'rgba(160,185,245,0)');
    g.fillStyle=rg; g.fillRect(x-r,y-r,r*2,r*2); }
  g.restore();
  const t=new TH.CanvasTexture(c); t.encoding=TH.sRGBEncoding; return t;
}
scene.add(new TH.Mesh(new TH.SphereGeometry(1000,48,24),new TH.MeshBasicMaterial({map:skyTex(),side:TH.BackSide,fog:false,depthWrite:false})));
{ const N=2600, pos=new Float32Array(N*3), sz=new Float32Array(N), col=new Float32Array(N*3);   // 星星用 Points 畫才夠銳利
  for(let i=0;i<N;i++){ const a=Math.random()*6.283, e=Math.asin(Math.random()*0.98+0.02), r=950;
    pos[i*3]=Math.cos(a)*Math.cos(e)*r; pos[i*3+1]=Math.sin(e)*r; pos[i*3+2]=Math.sin(a)*Math.cos(e)*r;
    const b=Math.pow(Math.random(),2.2), w=0.7+Math.random()*0.3; sz[i]=1.2+b*3.4;
    col[i*3]=w*(0.85+0.15*Math.random()); col[i*3+1]=w*(0.9+0.1*Math.random()); col[i*3+2]=w; }
  const g=new TH.BufferGeometry(); g.setAttribute('position',new TH.BufferAttribute(pos,3)); g.setAttribute('aSize',new TH.BufferAttribute(sz,1)); g.setAttribute('color',new TH.BufferAttribute(col,3));
  const m=new TH.ShaderMaterial({uniforms:{map:{value:DOT},pr:{value:renderer.getPixelRatio()}},transparent:true,depthWrite:false,blending:TH.AdditiveBlending,vertexColors:true,fog:false,
    vertexShader:'attribute float aSize; uniform float pr; varying vec3 vC; void main(){ vC=color; gl_PointSize=aSize*pr; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:'uniform sampler2D map; varying vec3 vC; void main(){ vec4 t=texture2D(map,gl_PointCoord); gl_FragColor=vec4(vC*t.a*0.9,t.a); }'});
  const stars=new TH.Points(g,m); stars.frustumCulled=false; scene.add(stars); }
const NORTH=new TH.Vector3(0,Math.sin(0.60),-Math.cos(0.60)).multiplyScalar(760);      // 北極星方向（仰角約 34°）
function starSprite(pos,scale,color,op,tex){
  const s=new TH.Sprite(new TH.SpriteMaterial({map:tex||FLARE,color:color,transparent:true,opacity:op,blending:TH.AdditiveBlending,depthWrite:false,fog:false}));
  s.position.copy(pos); s.scale.set(scale,scale,1); scene.add(s); return s;
}
const polaris=starSprite(NORTH,60,0xffffff,1);
starSprite(NORTH,150,0x6fb8ff,0.22,DOT);
// 小北斗七星（尾巴第一顆就是北極星）：在天空上畫出來，和刀身上的刻紋呼應
const RIGHT=new TH.Vector3(1,0,0), UP=new TH.Vector3(0,Math.cos(0.60),Math.sin(0.60));
for(const p of [[-55,-40,18],[-125,-62,14],[-190,-30,15],[-250,-70,15],[-330,-48,15],[-300,-118,14]]){
  starSprite(NORTH.clone().addScaledVector(RIGHT,p[0]).addScaledVector(UP,p[1]),p[2]*1.8,0xdfeeff,0.85);
}

/* ================= 極光（北方地平線上的流動光幕） ================= */
const auroraMat=new TH.ShaderMaterial({uniforms:{t:{value:0}},transparent:true,depthWrite:false,blending:TH.AdditiveBlending,side:TH.DoubleSide,fog:false,
  vertexShader:'varying vec2 vUv; uniform float t;\n'+
    'void main(){ vUv=uv; vec3 p=position; p.y+=sin(uv.x*6.0+t*0.5)*7.0; gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0); }',
  fragmentShader:'varying vec2 vUv; uniform float t;\n'+
    'void main(){ float x=vUv.x, y=vUv.y;\n'+
    ' float n=sin(x*5.0+t*0.45)*0.5+0.5;\n'+
    ' float r1=sin(x*23.0+t*0.7)*0.5+0.5, r2=sin(x*57.0-t*1.3+2.0)*0.5+0.5, r3=sin(x*131.0+t*0.4+1.0)*0.5+0.5;\n'+
    ' float rays=pow(0.35*r1+0.40*r2+0.25*r3,2.4)*1.7+0.12;\n'+
    ' float rim=0.08+0.10*n+0.04*r1;\n'+
    ' float v=max(0.0,(y-rim)/(1.0-rim));\n'+
    ' float curtain=smoothstep(-0.03,0.02,y-rim)*exp(-v*3.4);\n'+
    ' float i=curtain*rays*(0.7+0.3*n);\n'+
    ' vec3 col=mix(vec3(0.15,1.0,0.55),vec3(0.25,0.55,1.0),clamp(v*2.6,0.0,1.0));\n'+
    ' col=mix(col,vec3(0.7,0.3,1.0),smoothstep(0.35,1.0,v)*0.6);\n'+
    ' float edge=smoothstep(0.0,0.16,x)*(1.0-smoothstep(0.84,1.0,x));\n'+
    ' gl_FragColor=vec4(col*i*0.62*edge, i*edge); }'});
for(const a of [[-140,20,-480,560,220,0.25],[160,16,-420,420,160,-0.35],[-10,26,-580,760,260,0.05]]){
  const m=new TH.Mesh(new TH.PlaneGeometry(a[3],a[4],48,1),auroraMat);
  m.position.set(a[0],a[1]+a[4]/2,a[2]); m.rotation.y=a[5]; scene.add(m);
}

/* ================= 月亮 / 燈光 ================= */
const moonPos=new TH.Vector3(-420,250,-300);
const moon=new TH.Mesh(new TH.SphereGeometry(8,24,16),new TH.MeshBasicMaterial({color:0xfff6e0,fog:false}));
moon.position.copy(moonPos); scene.add(moon);
starSprite(moonPos,70,0xcfdcff,0.2,DOT);
const moonLight=new TH.DirectionalLight(0xbcd0ff,0.42);
moonLight.position.copy(moonPos.clone().normalize().multiplyScalar(70)); moonLight.castShadow=true;
moonLight.shadow.mapSize.set(2048,2048);
{ const sc=moonLight.shadow.camera; sc.left=-28; sc.right=28; sc.top=28; sc.bottom=-28; sc.near=1; sc.far=220; }
moonLight.shadow.bias=-0.0008;
scene.add(moonLight); scene.add(moonLight.target);
scene.add(new TH.HemisphereLight(0x2b4380,0x0b0d13,0.34));

/* ================= 空地：地面 / 草叢 / 石頭 / 樹線 / 木柵欄 ================= */
function groundTex(){
  return makeTex((g,S)=>{
    g.fillStyle='#2a2922'; g.fillRect(0,0,S,S);
    for(let i=0;i<160;i++){ const x=Math.random()*S,y=Math.random()*S,r=30+Math.random()*100;
      const col=Math.random()<.62?'52,66,38':'34,40,30';

let mainEnv=null;
function getEnv(){                                        // 夜景環境貼圖：金屬反射才會有「月光 + 極光」
  if(mainEnv) return mainEnv;
  const c=document.createElement('canvas'); c.width=512; c.height=256; const g=c.getContext('2d');
  const sky=g.createLinearGradient(0,0,0,140); sky.addColorStop(0,'#0a1230'); sky.addColorStop(.8,'#1d3566'); sky.addColorStop(1,'#3b5a8c');
  g.fillStyle=sky; g.fillRect(0,0,512,140);
  const gnd=g.createLinearGradient(0,140,0,256); gnd.addColorStop(0,'#25302e'); gnd.addColorStop(1,'#0a0c10');
  g.fillStyle=gnd; g.fillRect(0,140,512,116);
  for(const b of [[70,40,60,'255,246,225','.95'],[300,62,130,'120,230,210','.5'],[430,48,46,'200,220,255','.8']]){   // 月亮 / 極光 / 補光
    const rg=g.createRadialGradient(b[0],b[1],2,b[0],b[1],b[2]);
    rg.addColorStop(0,'rgba('+b[3]+','+b[4]+')'); rg.addColorStop(1,'rgba('+b[3]+',0)');
    g.fillStyle=rg; g.beginPath(); g.arc(b[0],b[1],b[2],0,7); g.fill(); }
  const t=new TH.CanvasTexture(c); t.mapping=TH.EquirectangularReflectionMapping;
  const p=new TH.PMREMGenerator(renderer); mainEnv=p.fromEquirectangular(t).texture; t.dispose(); p.dispose();
  return mainEnv;
}

/* ================= 右手（戰術手套）：四指環握、拇指壓在握把上緣 ================= */
let _gloveTex=null;
function gloveTex(){
  if(_gloveTex) return _gloveTex;
  _gloveTex=makeTex((g,S)=>{ g.fillStyle='#2c313a'; g.fillRect(0,0,S,S);
    for(let y=0;y<S;y+=5){ g.strokeStyle='rgba(70,78,92,.35)'; g.lineWidth=1.5; g.beginPath(); for(let x=0;x<=S;x+=4) g.lineTo(x,y+Math.sin(x/4*Math.PI)*1.2); g.stroke(); }
    for(let x=0;x<S;x+=9){ g.strokeStyle='rgba(14,16,22,.35)'; g.lineWidth=1; g.beginPath(); g.moveTo(x,0); g.lineTo(x,S); g.stroke(); }
    grain(g,S,10); });
  _gloveTex.repeat.set(4,4); return _gloveTex;
}
function gloveMats(){
  return {
    fab  :new TH.MeshStandardMaterial({map:gloveTex(),color:0xffffff,roughness:.86,metalness:.06}),   // 布面（針織紋）
    pad  :new TH.MeshStandardMaterial({color:0x171a20,roughness:.45,metalness:.30}),   // 指節護甲
    seam :new TH.MeshStandardMaterial({color:0x0e1014,roughness:.96,metalness:0}),     // 縫線
    strap:new TH.MeshStandardMaterial({color:0x3a404b,roughness:.85,metalness:.14}),   // 腕帶
  };
}
function limbSeg(parent,a,b,r,mat,r2){                    // 兩點間圓柱 + 兩端球（r128 沒有 CapsuleGeometry）
  const A=new TH.Vector3(a[0],a[1],a[2]), B=new TH.Vector3(b[0],b[1],b[2]);
  const d=new TH.Vector3().subVectors(B,A), len=d.length(), rB=(r2==null?r:r2);
  const cyl=new TH.Mesh(new TH.CylinderGeometry(rB,r,len,12),mat);
  cyl.position.copy(A).addScaledVector(d,0.5); cyl.quaternion.setFromUnitVectors(new TH.Vector3(0,1,0),d.clone().normalize()); parent.add(cyl);
  for(const e of [[A,r],[B,rB]]){ const s=new TH.Mesh(new TH.SphereGeometry(e[1],12,10),mat); s.position.copy(e[0]); parent.add(s); }
}
function makeHand(mode){
  const through=(mode!=='wrap'), rev=(mode==='reverse'), h=new TH.Group(), M=gloveMats(); h.userData.mode=mode;
  const blob=(sx,sy,sz,x,y,z,seg)=>{ const m=new TH.Mesh(new TH.SphereGeometry(0.5,seg||16,12),M.fab); m.scale.set(sx,sy,sz); m.position.set(x,y,z); h.add(m); return m; };
  if(rev){ blob(0.36,0.17,0.10,-0.285,-0.005,0.125,18); blob(0.30,0.16,0.10,-0.27,0.095,0.12,14); blob(0.34,0.15,0.07,-0.27,0.02,0.17,16); }   // 反手指虎：手掌在握把前面(+z)，手腕在 +y 側
  else if(through){ blob(0.36,0.17,0.10,-0.285,-0.005,0.125,18); blob(0.17,0.16,0.10,-0.43,-0.02,0.125,14); blob(0.34,0.15,0.07,-0.27,0.03,0.17,16); }   // 正手指虎
  else { blob(0.36,0.185,0.115,-0.285,-0.010,-0.078,18); blob(0.17,0.175,0.108,-0.430,-0.026,-0.070,14); blob(0.34,0.165,0.075,-0.278,0.030,0.052,16); }   // 一般握法：掌心 -z、手背 +z
  /* 四根手指＝三節關節鏈（指根 J1 → 中節 J2 → 指尖 J3）。wrap：從指節往上、繞過握把；through：從手掌直直穿過指孔(-z)、在背面彎下去 */
  const FL=[]; h.userData.fingerList=FL;
  const FING=rev?[[-0.140,0.031,0.86],[-0.235,0.036,0.96],[-0.330,0.039,1.02],[-0.422,0.038,1.00]]   // 反手：小指在刀刃那端
                :[[-0.140,0.038,1.00],[-0.235,0.039,1.02],[-0.330,0.036,0.96],[-0.422,0.031,0.86]];
  for(const f of FING){ const fx=f[0], r=f[1], k=f[2], L=through?[0.165,0.085*k,0.070*k]:[0.075*k,0.090*k,0.080*k];
    const J1=new TH.Group(); J1.position.set(fx,through?0.0:0.086,through?0.115:0.042); h.add(J1);
    const J2=new TH.Group(); J2.position.set(0,L[0],0); J1.add(J2);
    const J3=new TH.Group(); J3.position.set(0,L[1],0); J2.add(J3);
    limbSeg(J1,[0,0,0],[0,L[0],0],r,M.fab,r*0.96);
    limbSeg(J2,[0,0,0],[0,L[1],0],r*0.94,M.fab,r*0.88);
    limbSeg(J3,[0,0,0],[0,L[2],0],r*0.84,M.fab,r*0.70);
    const pz=through?r*0.45:-r*0.45;
    const pad=new TH.Mesh(new TH.BoxGeometry(r*1.7,r*1.0,r*0.9),M.pad); pad.position.set(0,0.016,pz); J1.add(pad);        // 指根護甲
    const pad2=new TH.Mesh(new TH.BoxGeometry(r*1.5,r*0.9,r*0.8),M.pad); pad2.position.set(0,0.012,pz*0.9); J2.add(pad2);  // 中節護甲

      if(flType===1){ wrist.rotation.x+=sp*Math.PI*2; hand.rotation.z=Math.sin(sp*Math.PI*2)*0.12; setRipple(t,0.04,0.56,0.05,0.5); }
      else if(flType===2){ wrist.rotation.y+=Math.sin(sp*Math.PI)*0.9; hand.rotation.z+=Math.sin(sp*Math.PI)*0.25; thOpen=open*0.6; setRipple(t,0.04,0.56,0.05,0.4); }
      else { const jb=Math.sin(sp*Math.PI); gz-=0.16*jb; gx-=0.10*jb; insX-=0.15*jb; wrist.rotation.z+=0.2*jb; }                      // 指虎直拳
    } else if(flType===1){ kspin.rotation.z=-sp*Math.PI*2; kspin.position.z=PIV_T.z+0.06*Math.sin(sp*Math.PI); setRipple(t,0.04,0.56,0.05,1.2); for(let i=0;i<4;i++) fOpen[i]+=wig(i);
      hand.rotation.z=Math.sin(sp*Math.PI*2)*0.18; wrist.rotation.x+=Math.sin(sp*Math.PI)*0.45; gx+=Math.sin(sp*Math.PI*2)*0.03; }      // 手跟著刀轉晃
    else if(flType===2){ kspin.position.copy(PIV_F); kIn.position.copy(PIV_F).negate(); kspin.rotation.z=sp*Math.PI*2;
      setRipple(t,0.04,0.56,0.05,0.9); fOpen[2]*=0.55; fOpen[3]*=0.4; thOpen=open*0.7; for(let i=0;i<2;i++) fOpen[i]+=wig(i);
      wrist.rotation.y+=Math.sin(sp*Math.PI)*0.35; hand.rotation.z=-Math.sin(sp*Math.PI*2)*0.08; }
    else { const h=Math.sin(sp*Math.PI); kspin.position.y=PIV_T.y+h*0.26; kspin.rotation.y=sp*Math.PI*2; setRipple(t,0.04,0.56,0.04,1.2); thOpen=open;
      hand.position.y+=0.12*Math.sin(Math.min(1,sp*3)*Math.PI)-0.02*h; wrist.rotation.z+=0.22*Math.sin(Math.min(1,sp*3)*Math.PI);     // 手往上甩
      gy+=0.08*SM(0.7,0.88,sp)*(1-SM(0.88,1,sp)); }                                                                                     // 再抬手接
    if(flT<=0){ flT=0; if(cur.otf) deployTarget=1; }
  }
  if(comboTimer>0){ comboTimer-=dt; if(comboTimer<=0){ combo=0; comboHits=0; } }
  // ── 耍刀（F，三角洲式）：收刀 → 手指張開、刀繞拇指轉兩圈 → 拋刀翻兩圈接住 → 手腕一甩「鏘」出刀 → 放下 ──
  if(insT>0){ insT-=dt; const t=INS_DUR-Math.max(0,insT);
    const lift=SM(0,0.25,t)*(1-SM(2.15,2.6,t));
    gx+=(0.02-gx)*lift; gy+=(-0.02-gy)*lift; gz+=(-0.36-gz)*lift; insX+=0.30*lift; insY+=0.20*lift;
    if(cur.otf){ if(t>0.05&&t<1.85) deployTarget=0; else if(t>=1.85) deployTarget=1; }
    let open=0;
    if(cur.fl==='heavy'){                                                                                   // 信條：舉到眼前慢慢翻面看紅寶石 → 翻回 → 繞拇指快翻一圈接住
      if(t>0.25&&t<1.55){ const u=(t-0.25)/1.30; wrist.rotation.x+=Math.sin(u*Math.PI)*Math.PI*0.9; insY+=Math.sin(u*Math.PI)*0.3; glowPulse=Math.max(glowPulse,0.5*Math.sin(u*Math.PI)); }   // 翻面：看得到手指從指孔穿出來
      else if(t>=1.55&&t<2.15){ const u=(t-1.55)/0.60, jb=Math.sin(u*Math.PI); gz-=0.22*jb; gx-=0.12*jb; gy-=0.04*jb; insX-=0.2*jb; wrist.rotation.z+=0.25*jb; camKick=Math.max(camKick,jb*0.5); }   // 指虎直拳
    } else if(t>0.22&&t<1.00){ const u=(t-0.22)/0.78, sp=EASE(u); kspin.rotation.z=-sp*Math.PI*4; kspin.position.z=PIV_T.z+0.06*Math.sin(u*Math.PI); open=SM(0.22,0.34,t)*(1-SM(0.92,1.02,t));
      setRipple(t,0.22,0.92,0.05,1.2); for(let i=0;i<4;i++) fOpen[i]+=0.25*open*Math.max(0,Math.sin(sp*Math.PI*8+i*1.3));
      hand.rotation.z=Math.sin(sp*Math.PI*4)*0.16; wrist.rotation.x+=Math.sin(u*Math.PI)*0.45; gx+=Math.sin(u*Math.PI*2)*0.04; gy+=Math.cos(u*Math.PI*2)*0.025; }   // 手跟著轉晃
    else if(t>=1.00&&t<1.85){ const sp=Math.max(0,Math.min(1,(t-1.05)/0.70)), h=Math.sin(sp*Math.PI), fl=Math.sin(Math.min(1,sp*2.5)*Math.PI);
      kspin.position.y=PIV_T.y+h*0.36; kspin.position.x=PIV_T.x+h*0.04; kspin.rotation.y=EASE(sp)*Math.PI*4; kspin.rotation.z=-h*0.2;
      open=SM(1.00,1.10,t)*(1-SM(1.70,1.80,t)); setRipple(t,1.00,1.70,0.04,1.2); thOpen=open; gy-=h*0.02; insX-=h*0.10;
      hand.position.y+=0.14*fl-0.03*h; wrist.rotation.z+=0.28*fl; gy+=0.10*SM(0.72,0.9,sp)*(1-SM(0.9,1,sp)); }                    // 甩上去、再抬手接
    else if(t>=1.85&&t<2.15){ const sp=(t-1.85)/0.30; wrist.rotation.z+=Math.sin(sp*Math.PI)*0.35; gy-=Math.sin(sp*Math.PI)*0.03; }
    if(insT<=0){ insT=0; if(cur.otf) deployTarget=1; }
  }
  // ── OTF 出刀 / 收刀 ──
  const prevOut=bladeOut;
  if(deployTarget>bladeOut) bladeOut=Math.min(1,bladeOut+dt/0.07); else if(deployTarget<bladeOut) bladeOut=Math.max(0,bladeOut-dt/0.12);
  const eo=1-Math.pow(1-bladeOut,3);
  KN.bladeGrp.position.x=-0.68*(1-eo); KN.slider.position.x=-0.16+0.09*eo;
  const gi=(0.55+0.45*eo)*(1+glowPulse*2.0);
  KN.mats.glow.emissiveIntensity=4.0*gi; KN.mats.glowW.emissiveIntensity=5.0*gi; KN.mats.win.emissiveIntensity=2.2*(0.8+0.2*eo)*(1+glowPulse);
  KN.light.intensity=(0.35+0.65*eo)*(1+glowPulse*3);
  CR.gem.emissiveIntensity=1.4*(0.85+0.15*Math.sin(T*3))*(1+glowPulse*2.5); CR.light.intensity=0.35*(1+glowPulse*3);
  // ── 套用姿勢 ──
  for(let i=0;i<4;i++){ let fo=Math.max(-0.15,Math.min(1.3,fOpen[i])); if(hand.userData.mode!=='wrap') fo=Math.min(fo,0.35);   // 套在指孔裡張不開
    const c=Math.max(0,Math.min(1.12,1-fo*0.85)), F=FL[i];                                                                             // fOpen → 三節關節一起伸直/彎曲
    F.j[0].rotation.x=F.base[0]+F.q[0]*c; F.j[1].rotation.x=F.base[1]+F.q[1]*Math.min(1.12,c*1.08); F.j[2].rotation.x=F.base[2]+F.q[2]*Math.min(1.12,c*1.15); }
  thumb.rotation.z=Math.min(1,thOpen)*0.5;
  gunGroup.position.set(gx,gy,gz); gunGroup.rotation.set(insX,insY,insZ);
  const fov=76+camKick*4; if(Math.abs(camera.fov-fov)>0.02){ camera.fov=fov; camera.updateProjectionMatrix(); }
  camera.updateMatrixWorld(true);
  if(prevOut<1&&bladeOut>=1) onDeploy();
  // ── 刀光 + 命中 ──
  const KM=cur.model, tipW=KM.localToWorld(_v.set(cur.tip,0,0)).clone(), baseW=KM.localToWorld(_v2.set(0.16,0,0)).clone(), trB=KM.localToWorld(_v3.set(cur.trb,0,0)).clone();
  if(trailOn) trS.push({b:trB,t:tipW,time:T});
  updateTrail(); prevTip=tipW;
  if(cur.otf&&bladeOut>0.9&&atkT===0&&insT===0){ dustT-=dt; if(dustT<=0){ dustT=0.06; const st=KN.stars[Math.random()*KN.stars.length|0];
    const pw=knife.localToWorld(_v.set(st[0],st[1],(Math.random()<.5?1:-1)*0.014)); spawnSparks(pw,1,null,0.10,0,true,0.0,0.014,0.7); } }
  updateSparks(dt); updateMarks(dt); updateRings(dt); updateHeads(dt); updateDummies(dt);
  $('flash').style.opacity=flashOp;
}

/* ================= 輸入 ================= */
const overlay=$('overlay');
overlay.addEventListener('click',()=>{ SFX.unlock(); canvas.requestPointerLock(); });
document.addEventListener('pointerlockchange',()=>{
  locked=(document.pointerLockElement===canvas);
  overlay.classList.toggle('hide',locked);
  if(locked&&!started){ started=true; introT=INTRO_DUR; }
});
document.addEventListener('mousemove',e=>{
  if(!locked) return; const dx=e.movementX||0, dy=e.movementY||0;
  player.yaw-=dx*0.0022; player.pitch=Math.max(-1.45,Math.min(1.45,player.pitch-dy*0.0022));
  swX+=dx*0.0025; swY+=dy*0.0025;
});
document.addEventListener('mousedown',e=>{ if(!locked) return; if(e.button===0) attack(); else if(e.button===2) inspect(); });
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  keys[e.code]=true; if(e.code==='Space') e.preventDefault(); if(!locked) return;
  if(e.code==='KeyF') inspect(); else if(e.code==='KeyR') toggleDeploy(); else if(e.code==='Digit1') switchTo(0); else if(e.code==='Digit2') switchTo(1); else if(e.code==='KeyQ') switchTo(1-wi);
});
document.addEventListener('keyup',e=>{ keys[e.code]=false; });
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });

/* ================= 主迴圈 ================= */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=Math.min(0.05,(now-last)/1000); last=now;
  if(hitStop>0){ hitStop-=dt; dt*=0.12; }              // 命中瞬間的定格感
  step(dt); composer.render();
}
requestAnimationFrame(loop);

/* ================= 除錯把手（Browser 窗格隱藏時 rAF 不跑，用這組手動步進 + 存圖） ================= */
window.__px={
  setup(w,h){ resize(w||1280,h||720); },
  step(n,dt){ n=n||1; dt=dt||1/60; for(let i=0;i<n;i++) step(dt); },
  render(){ composer.render(); },
  start(){ started=true; locked=true; introT=0; deployTarget=1; bladeOut=1; overlay.classList.add('hide'); },
  intro(){ started=true; locked=true; introT=INTRO_DUR; bladeOut=0; deployTarget=0; overlay.classList.add('hide'); },
  attack(type){ combo=(type==='stab')?2:(combo%3===2?0:combo); startAttack(); return atkDur; },
  inspect(){ insT=INS_DUR; }, deploy(v){ deployTarget=v?1:0; }, weapon(i){ applyWeapon(i); swapT=0; if(cur.otf){ bladeOut=1; deployTarget=1; } }, swap(i){ switchTo(i); },
  look(yaw,pitch){ player.yaw=yaw; player.pitch=pitch; }, move(x,z){ player.pos.x=x; player.pos.z=z; },
  pose(rx,ry,rz,px,py,pz,s){ rig.rotation.set(rx,ry,rz); rig.position.set(px,py,pz); if(s) rig.scale.setScalar(s); },
  bloom(s,r,t){ if(s!=null) bloom.strength=s; if(r!=null) bloom.radius=r; if(t!=null) bloom.threshold=t; },
  async save(name,q){ composer.render(); const d=canvas.toDataURL('image/jpeg',q||0.9);
    const r=await fetch('/save?name='+encodeURIComponent(name||'cap'),{method:'POST',body:d}); return r.text(); },
  get state(){ return {T:T,atkT:atkT,atkDur:atkDur,flT:flT,insT:insT,hitStop:hitStop,shake:shake,hp:DUM.map(d=>d.hp),bladeOut:bladeOut,combo:combo,hits:hits,pos:player.pos.toArray(),trail:trS.length}; },
  objs:{scene:scene,camera:camera,renderer:renderer,composer:composer,knife:knife,creed:creed,WEAPONS:WEAPONS,CR:CR,HANDS:HANDS,rig:rig,get hand(){return hand;},get fingerList(){return FL;},get thumb(){return thumb;},kspin:kspin,wrist:wrist,KN:KN,DUM:DUM,ATK:ATK,gunGroup:gunGroup,breakDummy:breakDummy}
};
</script>
